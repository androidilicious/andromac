name: build
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AndroMac-android
          path: android/app/build/outputs/apk/debug/*.apk

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd mac && xcodegen
      # Ad-hoc signed, without entitlements: everything works except the virtual webcam,
      # which needs a build signed with your own Apple Developer team (see README).
      - run: >
          xcodebuild -project mac/AndroMac.xcodeproj -scheme AndroMac -configuration Release
          -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS= DEVELOPMENT_TEAM=
          CODE_SIGN_STYLE=Manual
      - run: cd build/Build/Products/Release && ditto -c -k --keepParent AndroMac.app AndroMac-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AndroMac-mac
          path: build/Build/Products/Release/AndroMac-mac.zip
